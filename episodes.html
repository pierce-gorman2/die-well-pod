<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Episodes | Die Well</title>
  <meta
    name="description"
    content="Listen to every Die Well episode, including the introduction and featured conversations on mortality, discipleship, and Christian endurance."
  />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #2a221d;
      --ink: #f3eadf;
      --muted: #cbbdaa;
      --line: rgba(239, 227, 210, 0.16);
      --accent: #f6ecdf;
      --accent-soft: #b39c84;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Source Sans 3", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(255, 248, 239, 0.08), transparent 34%),
        linear-gradient(180deg, rgba(45, 36, 30, 0.94), rgba(28, 22, 18, 1)),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.24;
      background-image:
        linear-gradient(rgba(239, 227, 210, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(239, 227, 210, 0.02) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.72), transparent 85%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 1.1rem 1.5rem;
    }

    .nav-inner {
      width: min(100%, 1180px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.95rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(28, 22, 18, 0.56);
      backdrop-filter: blur(8px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.16);
    }

    .brand {
      color: var(--accent);
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 160ms ease;
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"] {
      color: var(--accent);
    }

    .page {
      padding: 2rem 2rem 5rem;
    }

    .shell {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: clamp(1.5rem, 3vw, 2.5rem);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(239, 227, 210, 0.08), rgba(28, 22, 18, 0.34));
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 1.1rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid rgba(239, 227, 210, 0.18);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1,
    h2 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      color: var(--accent);
      letter-spacing: -0.03em;
    }

    h1 {
      font-size: clamp(3.4rem, 7vw, 5.6rem);
      line-height: 0.92;
      margin-bottom: 2rem;
    }

    .episodes-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.15rem;
    }

    .episode-card {
      padding: 1.4rem;
      border: 1px solid rgba(239, 227, 210, 0.12);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(239, 227, 210, 0.08), rgba(28, 22, 18, 0.50));
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .episode-card:hover {
      transform: translateY(-3px);
      border-color: rgba(239, 227, 210, 0.24);
      background: linear-gradient(180deg, rgba(239, 227, 210, 0.12), rgba(28, 22, 18, 0.58));
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.18);
    }

    .episode-number {
      display: inline-block;
      margin-bottom: 0.9rem;
      color: var(--accent-soft);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h2 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 0.98;
      margin-bottom: 1.2rem;
    }

    .episode-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .episode-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 0.9rem;
      border: 1px solid rgba(239, 227, 210, 0.14);
      border-radius: 999px;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .episode-link:hover {
      transform: translateY(-1px);
      background: rgba(239, 227, 210, 0.10);
      border-color: rgba(239, 227, 210, 0.28);
      color: var(--accent);
    }

    @media (max-width: 640px) {
      .nav {
        padding: 0.9rem 1rem;
      }

      .nav-inner {
        padding: 0.85rem 0.95rem;
      }

      .brand {
        font-size: 1.15rem;
      }

      .nav-links {
        gap: 0.8rem;
      }

      .nav-links a {
        font-size: 0.82rem;
      }

      .page {
        padding: 1rem 1rem 4rem;
      }

      .episodes-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/" class="brand">Die Well</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/episodes.html" aria-current="page">Episodes</a>
      </div>
    </div>
  </nav>

  <main class="page">
    <section class="shell" aria-labelledby="episodes-title">
      <div class="eyebrow">Die Well podcast</div>
      <h1 id="episodes-title">Episodes</h1>

      <div class="episodes-list">
        <article class="episode-card">
          <span class="episode-number">Episode 00</span>
          <h2>Introduction</h2>
          <div class="episode-links">
            <a href="https://open.spotify.com/episode/4dayWpf2kIT2gwlTgMNz4w?si=1FnX7BzcTSuTgvmaGnB0EQ" class="episode-link" target="_blank" rel="noopener noreferrer">Spotify</a>
            <a href="https://podcasts.apple.com/us/podcast/00-introduction/id1871918633?i=1000747363167" class="episode-link" target="_blank" rel="noopener noreferrer">Apple Podcasts</a>
          </div>
        </article>

        <article class="episode-card">
          <span class="episode-number">Episode 01</span>
          <h2>What Does it Mean to Die Well?</h2>
          <div class="episode-links">
            <a href="https://open.spotify.com/episode/4x3DQYdHifBbqdlOzpVN1T?si=h8zER4hnSZuBwEWXP8-cvg" class="episode-link" target="_blank" rel="noopener noreferrer">Spotify</a>
            <a href="https://podcasts.apple.com/us/podcast/01-what-does-it-mean-to-die-well/id1871918633?i=1000747363291" class="episode-link" target="_blank" rel="noopener noreferrer">Apple Podcasts</a>
          </div>
        </article>

        <article class="episode-card">
          <span class="episode-number">Episode 02</span>
          <h2>Men Should Live a Hard Life.</h2>
          <div class="episode-links">
            <a href="https://open.spotify.com/episode/7732rxw63aastBrzaoeMIR?si=nwU9ZBbdQxOF4R2fnaiPOg" class="episode-link" target="_blank" rel="noopener noreferrer">Spotify</a>
            <a href="https://podcasts.apple.com/us/podcast/02-men-should-live-a-hard-life/id1871918633?i=1000751920780" class="episode-link" target="_blank" rel="noopener noreferrer">Apple Podcasts</a>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
